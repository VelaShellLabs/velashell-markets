# VelaShell 插件市场的完整编排。
#
#   docker compose up -d          # 数据库 + 对象存储 + 病毒引擎 + 统一认证 + API + 前端
#
# 一次性准备(SDK 还没发到 nuget.org 之前):
#   pwsh ./build/Sync-VelaShellSdk.ps1       # 把 VelaShell 的 SDK 包打进 ./packages
#   cp .env.example .env                     # 改掉 Mongo / MinIO 的默认凭据
#
# 端口:API 8080 / 前端 8000 / 统一认证 7020 / MinIO 9000(控制台 9001)/ Mongo 副本集 27017-27019 / clamd 3310
services:

  # MongoDB 副本集(rs0,primary + secondary + arbiter),与 EasilyNET 的
  # docker-compose.mongo.rs.yml 同一套拓扑。bitnami 镜像在设置了 ROOT 口令时自动开鉴权,
  # 副本集意味着驱动可以使用事务与变更流。
  # ADVERTISED_HOSTNAME 用 host.docker.internal:成员地址写进 rs 配置之后,
  # 容器内(extra_hosts 指到 host-gateway)和宿主机客户端解析到的是同一个地址。
  mongo_primary:
    image: bitnami/mongodb:latest
    container_name: market-mongo-primary
    restart: unless-stopped
    environment:
      - TZ=Asia/Chongqing
      - MONGODB_ADVERTISED_HOSTNAME=host.docker.internal
      - MONGODB_REPLICA_SET_MODE=primary
      - MONGODB_REPLICA_SET_NAME=rs0
      # 只在数据目录为空时用来创建 root 账号 —— 已经跑过的部署要补建账号,
      # 见 docs/deployment.md "给已有的 MongoDB 补上账号密码"。
      - MONGODB_ROOT_USER=${MONGO_ROOT_USER:-market}
      - MONGODB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-change-me-please}
      - MONGODB_REPLICA_SET_KEY=${MONGO_RS_KEY:-HxplckY2jXSwfDRE}
    ports:
      - "27017:27017"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "gateway.docker.internal:host-gateway"
    volumes:
      - mongodb_master_data:/bitnami/mongodb
    healthcheck:
      # 开了鉴权之后 ping 也要带凭据,否则健康检查永远是 unhealthy,依赖它的服务一个都起不来。
      test:
        - CMD-SHELL
        - mongosh --quiet -u "$$MONGODB_ROOT_USER" -p "$$MONGODB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 12

  mongo_secondary:
    image: bitnami/mongodb:latest
    container_name: market-mongo-secondary
    restart: unless-stopped
    depends_on:
      - mongo_primary
    environment:
      - TZ=Asia/Chongqing
      - MONGODB_ADVERTISED_HOSTNAME=host.docker.internal
      # 必须公告宿主机映射的端口(27018),否则它会公告容器内部端口 27017 ——
      # 与 primary 的公告地址完全相同,导致它误判"自己已在集群里"而永远加不进去。
      - MONGODB_ADVERTISED_PORT_NUMBER=27018
      - MONGODB_REPLICA_SET_MODE=secondary
      - MONGODB_REPLICA_SET_NAME=rs0
      - MONGODB_INITIAL_PRIMARY_PORT_NUMBER=27017
      - MONGODB_INITIAL_PRIMARY_HOST=host.docker.internal
      - MONGODB_INITIAL_PRIMARY_ROOT_USER=${MONGO_ROOT_USER:-market}
      - MONGODB_INITIAL_PRIMARY_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-change-me-please}
      - MONGODB_REPLICA_SET_KEY=${MONGO_RS_KEY:-HxplckY2jXSwfDRE}
    ports:
      - "27018:27017"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "gateway.docker.internal:host-gateway"

  mongo_arbiter:
    image: bitnami/mongodb:latest
    container_name: market-mongo-arbiter
    restart: unless-stopped
    depends_on:
      - mongo_primary
    environment:
      - TZ=Asia/Chongqing
      - MONGODB_ADVERTISED_HOSTNAME=host.docker.internal
      - MONGODB_ADVERTISED_PORT_NUMBER=27019
      - MONGODB_REPLICA_SET_MODE=arbiter
      - MONGODB_REPLICA_SET_NAME=rs0
      - MONGODB_INITIAL_PRIMARY_PORT_NUMBER=27017
      - MONGODB_INITIAL_PRIMARY_HOST=host.docker.internal
      - MONGODB_INITIAL_PRIMARY_ROOT_USER=${MONGO_ROOT_USER:-market}
      - MONGODB_INITIAL_PRIMARY_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-change-me-please}
      - MONGODB_REPLICA_SET_KEY=${MONGO_RS_KEY:-HxplckY2jXSwfDRE}
    ports:
      - "27019:27017"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "gateway.docker.internal:host-gateway"

  minio:
    image: minio/minio:latest
    container_name: market-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - TZ=Asia/Chongqing
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  # 病毒扫描引擎。首次启动会拉一遍病毒库(几分钟、约 300MB),healthcheck 因此给得很宽松 ——
  # 库没就绪时 clamd 不接受连接,而检测流水线会把"引擎不可用"当作重试而不是放行,不会误判上传者。
  clamav:
    image: clamav/clamav:latest
    container_name: market-clamav
    restart: unless-stopped
    environment:
      - TZ=Asia/Chongqing
      - CLAMAV_NO_MILTERD=true
    ports:
      - "3310:3310"
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  # 统一认证服务(OpenIddict + MongoDB)。商店点"登录"就跳到它,登录完再跳回商店。
  identity:
    build:
      context: .
      dockerfile: build/identity.Dockerfile
    container_name: market-identity
    restart: unless-stopped
    depends_on:
      mongo_primary:
        condition: service_healthy
    environment:
      - TZ=Asia/Chongqing
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_HTTP_PORTS=8080
      # 副本集连接串:成员在 rs 配置里公告的是 host.docker.internal,
      # 所以这里也用它(经 extra_hosts 走 host-gateway),驱动做拓扑发现时地址才对得上。
      - ConnectionStrings__Mongo=mongodb://${MONGO_ROOT_USER:-market}:${MONGO_ROOT_PASSWORD:-change-me-please}@host.docker.internal:27017,host.docker.internal:27018/velashell-identity?authSource=admin&replicaSet=rs0
      # issuer 必须是**浏览器能打开**的地址:它同时是令牌里的 iss,也是 discovery 里所有端点的前缀。
      # 换成对外域名时,下面 api 的 Auth__Issuer 与 web 的 MARKET_AUTHORITY 要一起改。
      - Identity__Issuer=${IDENTITY_ISSUER:-http://localhost:7020}
      - Identity__RequireHttps=${IDENTITY_REQUIRE_HTTPS:-false}
      - Identity__KeyDirectory=/app/keys
      # 前端客户端的回跳白名单。不在名单里的 redirect_uri 会被直接拒绝,这是防钓鱼的第一道闸。
      - Identity__Clients__0__ClientId=velashell-market-web
      - Identity__Clients__0__DisplayName=VelaShell 插件市场
      - Identity__Clients__0__RedirectUris__0=${WEB_ORIGIN:-http://localhost:8000}/callback
      - Identity__Clients__0__PostLogoutRedirectUris__0=${WEB_ORIGIN:-http://localhost:8000}
      - Identity__Clients__0__Scopes__0=velashell-market
      - Accounts__AllowSelfRegistration=${ALLOW_SELF_REGISTRATION:-true}
      # 首个账号:只在账号集合为空时创建。留空则去 /account/register 自助注册。
      - Accounts__Bootstrap__UserName=${BOOTSTRAP_USER:-}
      - Accounts__Bootstrap__Password=${BOOTSTRAP_PASSWORD:-}
    volumes:
      # 签名与加密密钥。丢了等于换签发者:所有已发出的令牌一起失效,所有人被登出。
      - identity-keys:/app/keys
    ports:
      - "7020:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    build:
      context: .
      dockerfile: build/api.Dockerfile
    container_name: market-api
    restart: unless-stopped
    depends_on:
      mongo_primary:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_started
      identity:
        condition: service_started
    environment:
      - TZ=Asia/Chongqing
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      # 演示数据:打开后在插件集合为空时播三个样例插件,它们会**真的走一遍检测流水线**
      # (打包 → 落隔离桶 → 静态检查 → 病毒扫描 → 发布),于是首页/下载/检测报告都是真实产物。
      - Market__SeedDemoData=${SEED_DEMO_DATA:-false}
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__Mongo=mongodb://${MONGO_ROOT_USER:-market}:${MONGO_ROOT_PASSWORD:-change-me-please}@host.docker.internal:27017,host.docker.internal:27018/velashell-market?authSource=admin&replicaSet=rs0
      # 用 host.docker.internal 而不是 minio:把预签名 URL 的 host 同时做成
      # 容器内(经 extra_hosts 走 host-gateway)与宿主机浏览器(Docker Desktop 会解析)都能访问。
      - ObjectStorage__Endpoint=http://host.docker.internal:9000
      - ObjectStorage__AccessKey=${MINIO_ROOT_USER:-minioadmin}
      - ObjectStorage__SecretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
      - ClamAv__Host=clamav
      - ClamAv__Port=3310
      # 认证:Issuer 是令牌里的 iss(浏览器看到的地址),Authority 是 API 在容器网络里
      # 真正能访问到的地址。两者指的是同一个服务,详见 docs/identity-integration.md。
      - Auth__Issuer=${IDENTITY_ISSUER:-http://localhost:7020}
      - Auth__Authority=http://identity:8080
      - Auth__Audience=${AUTH_AUDIENCE:-velashell-market}
      - Auth__RequireHttpsMetadata=${AUTH_REQUIRE_HTTPS:-false}
      - Auth__AllowedOrigins__0=${WEB_ORIGIN:-http://localhost:8000}
      # 审核员的 sub(就是认证服务首页显示的那串)。留空则审核台没人进得去 ——
      # 那时"需人工复核"的包会一直停在隔离区,这是安全的默认。
      - Auth__ModeratorSubjects__0=${MODERATOR_SUBJECT:-}
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./src/VelaShell.Market.Web
      dockerfile: ../../build/web.Dockerfile
    container_name: market-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - TZ=Asia/Chongqing
      # nginx 启动时把这两个值注入页面,前端据此发起 OIDC 登录。
      # 同一份构建产物因此能对接不同环境的认证服务,不必为换个地址重新打包。
      - MARKET_AUTHORITY=${IDENTITY_ISSUER:-http://localhost:7020}
      - MARKET_CLIENT_ID=velashell-market-web
    ports:
      - "8000:80"

volumes:
  mongodb_master_data:
  minio-data:
  clamav-db:
  identity-keys:
